[package]
name = "img2pdf"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "img2pdf"
path = "src/main.rs"

[features]
## fast_image_resize を使ったリサイズバックエンドを有効にする。
## 有効化後、環境変数 IMG2PDF_RESIZE_BACKEND=fast_image_resize でランタイム切り替え可能。
fast-image-resize-backend = ["dep:fast_image_resize"]

## turbojpeg (libjpeg-turbo) を使った JPEG エンコード/デコードバックエンドを有効にする。
## 有効化後、環境変数 IMG2PDF_JPEG_BACKEND=turbojpeg でランタイム切り替え可能。
turbojpeg-backend = ["dep:turbojpeg"]

## zune-jpeg を使った JPEG デコードバックエンドを有効にする（エンコードは image クレートを使用）。
## 有効化後、環境変数 IMG2PDF_JPEG_BACKEND=zune_jpeg でランタイム切り替え可能。
zune-jpeg-backend = ["dep:zune-jpeg"]

[dependencies]
# 画像処理
image = "0.24"

# 高速リサイズ（オプション、fast-image-resize-backend フィーチャで有効化）
fast_image_resize = { version = "6", optional = true }

# libjpeg-turbo バインディング（オプション、turbojpeg-backend フィーチャで有効化）
turbojpeg = { version = "1.4", features = ["image"], optional = true }

# 純 Rust JPEG デコーダ（オプション、zune-jpeg-backend フィーチャで有効化）
zune-jpeg = { version = "0.5", optional = true }

# PDF生成
pdf-writer = "0.11"

# GUI
fltk = { version = "1.4", features = ["fltk-bundled"] }

# JSON設定
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# クロスプラットフォーム ディレクトリ
dirs = "5.0"

# 並列処理
rayon = "1.7"

# エラーハンドリング
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
